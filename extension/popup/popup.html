<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Track Catcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Saved applications</h1>
      <span id="count" class="muted"></span>
    </header>

    <ul id="list" class="list"></ul>
    <p id="empty" class="empty muted" hidden>
      Nothing saved yet. Open a job application, fill it in, and click
      <strong>Save Application Data</strong> next to the submit button.
    </p>

    <footer>
      <button id="copyAll" type="button">Copy all JSON</button>
      <button id="clear" type="button" class="secondary">Clear all</button>
      <a id="options" href="#">Settings</a>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
