<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Track Catcher</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Job Track Catcher</h1>
      <span id="count" class="count"></span>
    </header>

    <ul id="captures" class="captures"></ul>
    <p id="empty" class="empty" hidden>No captures yet. Submit a form on any page to catch it.</p>

    <footer>
      <button id="export" type="button">Export CSV</button>
      <button id="clear" type="button" class="secondary">Clear</button>
      <a id="options" href="#">Settings</a>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
