<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Track Catcher — Settings</title>
    <style>
      body {
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
        font: 14px/1.5 system-ui, sans-serif;
      }
      label {
        display: block;
        margin: 16px 0 4px;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        padding: 6px 8px;
      }
      .hint {
        color: #656d76;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Settings</h1>

    <label for="sheetUrl">Tracking sheet URL</label>
    <input id="sheetUrl" type="text" placeholder="https://docs.google.com/spreadsheets/d/..." />
    <p class="hint">Not wired up yet — applications are stored locally and can be copied as JSON from the popup.</p>

    <label>
      <input id="enabled" type="checkbox" />
      Show the "Save Application Data" button on pages
    </label>

    <p><button id="save" type="button">Save</button> <span id="status"></span></p>

    <script src="options.js" type="module"></script>
  </body>
</html>
